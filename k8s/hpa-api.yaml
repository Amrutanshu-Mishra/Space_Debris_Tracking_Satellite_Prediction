# Scalability artifact only — not on the demo path. See k8s/README.md.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: prahari-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: prahari-api
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
