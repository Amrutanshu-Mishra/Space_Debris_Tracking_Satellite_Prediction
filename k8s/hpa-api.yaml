# Deck artifact — shows the scaling path only. The demonstration runs on
# Docker Compose (root docker-compose.yml), never on Kubernetes.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: prahari-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: prahari-api
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
