# Deck artifact — shows the scaling path only. The demonstration runs on
# Docker Compose (root docker-compose.yml), never on Kubernetes.
apiVersion: v1
kind: Service
metadata:
  name: prahari-web
spec:
  selector:
    app: prahari-web
  ports:
    - port: 80
      targetPort: 80
  # fronted by ingress.yaml; ClusterIP is enough
  type: ClusterIP
