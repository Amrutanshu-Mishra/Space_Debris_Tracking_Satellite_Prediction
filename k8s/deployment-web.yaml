# Deck artifact — shows the scaling path only. The demonstration runs on
# Docker Compose (root docker-compose.yml), never on Kubernetes.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prahari-web
  labels:
    app: prahari-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: prahari-web
  template:
    metadata:
      labels:
        app: prahari-web
    spec:
      containers:
        - name: web
          # nginx serving the built bundle; API base URL is baked at build
          # time as the same-origin path /api/v1 (see web/Dockerfile), so
          # there is no runtime config here.
          image: ghcr.io/PLACEHOLDER_ORG/prahari-web:latest
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
