# Scalability artifact only — not on the demo path. See k8s/README.md.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prahari-web
  labels:
    app: prahari-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: prahari-web
  template:
    metadata:
      labels:
        app: prahari-web
    spec:
      containers:
        - name: web
          image: ghcr.io/PLACEHOLDER_ORG/prahari-web:latest
          ports:
            - containerPort: 5173
          env:
            - name: VITE_API_BASE_URL
              value: "https://api.PLACEHOLDER_DOMAIN/api/v1"
            - name: VITE_WS_BASE_URL
              value: "wss://api.PLACEHOLDER_DOMAIN/api/v1"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
