# Deck artifact — shows the scaling path only. The demonstration runs on
# Docker Compose (root docker-compose.yml), never on Kubernetes.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prahari-api
  labels:
    app: prahari-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: prahari-api
  template:
    metadata:
      labels:
        app: prahari-api
    spec:
      containers:
        - name: api
          image: ghcr.io/PLACEHOLDER_ORG/prahari-api:latest
          ports:
            - containerPort: 8000
          env:
            - name: PRAHARI_DATA_SOURCE
              value: "live"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: prahari-secrets
                  key: database-url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: prahari-secrets
                  key: redis-url
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
