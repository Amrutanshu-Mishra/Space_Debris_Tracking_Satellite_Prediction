[project]
name = "prahari-orbital"
version = "0.1.0"
description = "PRAHARI orbital core: ingest, propagate, filter, screen, score. Pure library, no web framework."
requires-python = ">=3.11"
dependencies = [
    "skyfield>=1.49",
    "sgp4>=2.23",
    "numpy>=1.26",
    "scipy>=1.12",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "mypy>=1.9",
    "datamodel-code-generator>=0.25",
]

[tool.ruff]
line-length = 100

[tool.mypy]
strict = true
