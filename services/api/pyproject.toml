[project]
name = "prahari-api"
version = "0.1.0"
description = "PRAHARI FastAPI app. Thin — depends on prahari_orbital for anything domain-specific."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "redis>=5.0",
    "websockets>=12.0",
    "prahari-orbital",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.4",
    "mypy>=1.9",
    "aiosqlite>=0.20",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

# `alembic/` (migration scripts) and `tests/` sit alongside `prahari_api/` at
# the top level, so setuptools' flat-layout auto-discovery refuses to guess
# ("Multiple top-level packages discovered"). Name the one importable package
# explicitly — same as services/orbital/pyproject.toml.
[tool.setuptools]
packages = ["prahari_api"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# B008: FastAPI's Depends(...)-as-default is the documented pattern, not a bug.
ignore = ["B008"]

[tool.mypy]
strict = true
