name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  orbital:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e services/orbital[dev]
      - name: Lint
        run: |
          cd services/orbital
          ruff check .
          mypy prahari_orbital
      - name: Test
        run: |
          cd services/orbital
          pytest -q

  api:
    runs-on: ubuntu-latest
    needs: orbital
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          pip install -e services/orbital
          pip install -e services/api[dev]
      - name: Lint
        run: |
          cd services/api
          ruff check .
          mypy prahari_api
      - name: Test (mock data source)
        env:
          PRAHARI_DATA_SOURCE: mock
        run: |
          cd services/api
          pytest -q

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - name: Install
        working-directory: web
        run: npm install
      - name: Lint
        working-directory: web
        run: npm run lint
      - name: Typecheck
        working-directory: web
        run: npm run typecheck
      - name: Build
        working-directory: web
        run: npm run build

  compose-smoke:
    runs-on: ubuntu-latest
    needs: [orbital, api, web]
    steps:
      - uses: actions/checkout@v4
      - name: Copy env
        run: cp .env.example .env
      - name: Build stack
        run: docker compose build
      - name: Boot mock API and hit /health
        run: |
          docker compose up -d api
          for i in $(seq 1 20); do
            if curl -sf http://localhost:8000/api/v1/health; then exit 0; fi
            sleep 3
          done
          echo "api did not become healthy" && exit 1
      - name: Teardown
        if: always()
        run: docker compose down -v
