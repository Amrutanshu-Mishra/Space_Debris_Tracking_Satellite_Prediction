# Served by the web container: the static SPA plus a same-origin proxy to the
# api service. The only upstream is `api` on the compose/k8s network — there
# is no proxy target on the public internet.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # content-hashed build assets — safe to cache hard
    location /assets/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # same-origin API + websocket proxy. Path is passed through unchanged, so
    # /api/v1/... reaches the API exactly as mounted.
    #
    # proxy_pass is given a *variable*, which forces nginx to resolve `api`
    # per request via the resolver below instead of once at startup. So this
    # container starts even when the API is down or not yet in DNS; requests
    # made while it is unreachable return 502, and recover on their own once
    # it comes up. 127.0.0.11 is Docker's embedded DNS (Kubernetes injects
    # its own resolver config, which this line is harmless alongside).
    location /api/ {
        resolver 127.0.0.11 ipv6=off valid=10s;
        set $prahari_api "http://api:8000";
        proxy_pass $prahari_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout 3600s;
    }

    # SPA history fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
